[workspace]
resolver = "3"
members = [
    "apps/*",
    "crates/core/*",
    "crates/engine/*",
    "crates/islands/*",
    "crates/platform/*",
    "crates/services/*",
    "crates/ui/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dokka-animation = { path = "crates/engine/dokka-animation" }
dokka-components = { path = "crates/ui/dokka-components" }
dokka-config = { path = "crates/services/dokka-config" }
dokka-contracts = { path = "crates/core/dokka-contracts" }
dokka-dock = { path = "crates/islands/dokka-dock" }
dokka-events = { path = "crates/core/dokka-events" }
dokka-icons = { path = "crates/ui/dokka-icons" }
dokka-interaction = { path = "crates/engine/dokka-interaction" }
dokka-launchpad = { path = "crates/islands/dokka-launchpad" }
dokka-model = { path = "crates/core/dokka-model" }
dokka-previews = { path = "crates/islands/dokka-previews" }
dokka-scene = { path = "crates/engine/dokka-scene" }
dokka-settings = { path = "crates/islands/dokka-settings" }
dokka-state = { path = "crates/core/dokka-state" }
dokka-theme = { path = "crates/ui/dokka-theme" }
dokka-win-apps = { path = "crates/platform/dokka-win-apps" }
dokka-win-composition = { path = "crates/platform/dokka-win-composition" }
dokka-win-control = { path = "crates/platform/dokka-win-control" }
dokka-win-media = { path = "crates/platform/dokka-win-media" }
dokka-win-surface = { path = "crates/platform/dokka-win-surface" }
dokka-win-text = { path = "crates/platform/dokka-win-text" }
dokka-win-tracking = { path = "crates/platform/dokka-win-tracking" }
lucide-icons = { version = "1.81", default-features = false }
windows = "0.62"
windows-collections = "0.3"
windows-core = "0.62"
windows-numerics = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

# El `watch` compila en dev: estos crates hacen trabajo por píxel o por
# fotograma y en dev se notan; solo se acelera su código, sin cambiar nada.
[profile.dev.package.dokka-icons]
opt-level = 3
[profile.dev.package.dokka-win-apps]
opt-level = 3
[profile.dev.package.dokka-win-composition]
opt-level = 3
[profile.dev.package.dokka-win-text]
opt-level = 3
